function header(){var tabs=['today','log session','history','export','week plan','settings'];return '<div class="header"><div><div class="title">200KG DEADLIFT</div><div class="subtitle">16-week · deadlift priority · clean workout tracker</div></div><div class="badge">TRACKER</div></div><div class="nav">'+tabs.map(function(t){return '<button class="'+(state.tab===t?'active':'')+'" data-action="tab" data-tab="'+t+'">'+t+'</button>'}).join('')+'</div>'}
function viewToday(){var p=phase(state.week);return '<div class="card hero"><h2>Week '+state.week+'<span class="phase" style="background:'+p.colour+'">'+p.short+'</span></h2><div class="tiny">'+esc(p.goal)+' · <button class="link-btn" data-action="tab" data-tab="log session">log a session ›</button> · <button class="link-btn" data-action="advance-week">advance to week '+Math.min(16,state.week+1)+' ›</button></div>'+DAYS.map(function(d){var st=status(state.week,d);var names=exs(state.week,d).slice(0,2).map(function(x){return x.name}).join(' · ');return '<div class="workout-row" data-action="open-session" data-day="'+d+'" data-week="'+state.week+'"><div><strong>'+LABELS[d]+'</strong><div class="tiny">'+esc(names)+'</div></div><div class="status '+st+'">'+(st==='logged'?'✓ Logged':st==='draft'?'Draft':'Pending')+'</div></div>'}).join('')+'</div><div class="section-title">Programme Stats</div><div class="stats">'+[['Current Week',state.week,'/ 16'],['Phase',p.short,''],['Deadlift',state.maxes.deadlift||'—',state.maxes.unit||'kg'],['Press',state.maxes.press||'—',state.maxes.unit||'kg'],['Bench',state.maxes.bench||'—',state.maxes.unit||'kg']].map(function(a){return '<div class="stat"><div class="stat-label">'+a[0]+'</div><div class="stat-value">'+a[1]+' <span class="tiny">'+a[2]+'</span></div></div>'}).join('')+'</div>'}
function viewLog(){var d=currentDraft();return '<div class="section-title">Log Session</div><div class="week-nav"><button class="nav-btn" data-action="set-log-week" data-week="'+Math.max(1,state.logWeek-1)+'">‹ Prev</button><div class="week-title">Week '+state.logWeek+(state.logWeek===state.week?' <span class="phase" style="background:var(--acc)">Current</span>':'')+'</div><button class="nav-btn" data-action="set-log-week" data-week="'+Math.min(16,state.logWeek+1)+'">Next ›</button></div><div class="tabs">'+DAYS.map(function(day,i){var st=status(state.logWeek,day);return '<button class="nav-btn '+(state.day===day?'active ':'')+(st==='logged'?'logged':st==='draft'?'draft':'')+'" data-action="set-day" data-day="'+day+'">Day '+(i+1)+(st==='logged'?' ✓':st==='draft'?' •':'')+'</button>'}).join('')+'</div><div class="tiny">'+LABELS[state.day]+' · draft autosaves as you type</div><div class="card">'+Object.keys(d).map(function(id){var ex=d[id];return '<div class="exercise"><h3>'+esc(ex.name)+'</h3><div class="rx">'+esc(ex.rx)+'</div><div class="set-head"><div class="set-num">#</div><div class="set-label">Weight</div><div class="set-label">Reps</div><div class="set-label">RPE</div></div>'+ex.sets.map(function(s,i){return '<div class="set-row"><div class="set-num">'+(i+1)+'</div><input class="num-input" type="text" inputmode="decimal" data-action="edit-set" data-ex="'+id+'" data-set="'+i+'" data-field="weight" value="'+esc(s.weight)+'"><input class="num-input" type="text" inputmode="numeric" data-action="edit-set" data-ex="'+id+'" data-set="'+i+'" data-field="reps" value="'+esc(s.reps)+'"><input class="num-input" type="text" inputmode="decimal" data-action="edit-set" data-ex="'+id+'" data-set="'+i+'" data-field="rpe" value="'+esc(s.rpe)+'">'+(ex.sets.length>1?'<button class="delete-set" data-action="delete-set" data-ex="'+id+'" data-set="'+i+'">×</button>':'')+'</div>'}).join('')+'<button class="add-set" data-action="add-set" data-ex="'+id+'">+ Add set</button><input class="notes" type="text" data-action="edit-notes" data-ex="'+id+'" value="'+esc(ex.notes)+'" placeholder="Notes (optional)..."></div>'}).join('')+'<div class="save-row"><button class="save-btn" data-action="save-session">SAVE SESSION</button><span class="tiny">Autosaved drafts are local. Saved sessions appear in history/export.</span></div></div>'}
function viewHistory(){var items=Object.keys(state.logs).map(function(k){return state.logs[k]}).sort(function(a,b){return b.week-a.week||DAYS.indexOf(b.session)-DAYS.indexOf(a.session)});return '<div class="section-title">Session History</div><div class="card">'+(items.length?items.map(function(item,i){var open=state.openHistory===i;return '<div class="history-item"><div class="history-top" data-action="toggle-history" data-index="'+i+'"><div><div class="history-title">Week '+item.week+'</div><div class="tiny">'+LABELS[item.session]+'</div></div><div class="tiny">'+esc(item.date)+'<br>'+(open?'▲':'▼')+'</div></div>'+(open?'<div class="history-detail">'+Object.keys(item.exercises).map(function(id){var ex=item.exercises[id];var sets=ex.sets.filter(function(s){return s.weight||s.reps||s.rpe});if(!sets.length&&!ex.notes)return '';return '<div style="margin-bottom:10px"><strong>'+esc(ex.name)+'</strong>'+sets.map(function(s,idx){var parts=[];if(s.weight)parts.push(s.weight+(state.maxes.unit||'kg'));if(s.reps)parts.push(s.reps+' reps');if(s.rpe)parts.push('RPE '+s.rpe);return '<div class="tiny">Set '+(idx+1)+': '+esc(parts.join(' × '))+'</div>'}).join('')+(ex.notes?'<div class="tiny">'+esc(ex.notes)+'</div>':'')+'</div>'}).join('')+'</div>':'')+'</div>'}).join(''):'<div class="tiny">No sessions logged yet.</div>')+'</div>'}
function viewExport(){return '<div class="section-title">Export</div><div class="card"><div class="save-row"><button class="export-btn" data-action="make-export">GENERATE EXPORT</button>'+(state.exportText?'<button class="nav-btn" data-action="copy-export">'+(state.copied?'Copied ✓':'Copy to Clipboard')+'</button>':'')+'</div>'+(state.exportText?'<textarea class="export-box" readonly onclick="this.select()">'+esc(state.exportText)+'</textarea>':'<div class="tiny">Generate a plain-text log from saved sessions.</div>')+'</div>'}
function viewPlan(){return '<div class="section-title">16-Week Programme</div>'+Array.from({length:16},function(_,i){var w=i+1,p=phase(w);return '<div class="week-row '+(w===state.week?'current':'')+'" data-action="show-week" data-week="'+w+'"><div class="week-num">W'+w+'</div><div class="week-tag">'+(w===16?'Test':p.short)+'</div><div>'+esc(p.goal)+'</div><div>›</div></div>'}).join('')}
function viewSettings(){return '<div class="section-title">Settings</div><div class="card"><h3>Training maxes / working maxes</h3><div class="tiny">These autosave and pre-fill suggested loads only; you can overwrite every set.</div>'+['deadlift','press','bench'].map(function(k){return '<input class="setup-input" type="text" inputmode="decimal" data-action="set-max" data-max="'+k+'" placeholder="'+k.charAt(0).toUpperCase()+k.slice(1)+' max / TM" value="'+esc(state.maxes[k])+'">'}).join('')+'<select class="setup-input" data-action="set-unit"><option '+(state.maxes.unit==='kg'?'selected':'')+'>kg</option><option '+(state.maxes.unit==='lb'?'selected':'')+'>lb</option></select></div>'}
function render(){try{var views={today:viewToday,'log session':viewLog,history:viewHistory,export:viewExport,'week plan':viewPlan,settings:viewSettings};app.innerHTML=header()+views[state.tab]()}catch(err){app.innerHTML='<div class="error"><strong>App failed to load.</strong><br>'+esc(err&&err.message?err.message:err)+'</div>';throw err}}
function showWeek(week){modal.innerHTML='<div class="modal-box"><div class="modal-head"><strong>WEEK '+week+'</strong><button class="mini-btn" data-action="close-modal">Close</button></div><div class="modal-body">'+DAYS.map(function(day){return '<h3 style="margin-top:14px">'+LABELS[day]+'</h3>'+exs(week,day).map(function(ex){return '<div class="lift-line"><span>'+esc(ex.name)+'</span><span class="rx">'+esc(ex.rx)+'</span></div>'}).join('')}).join('')+'</div></div>';modal.classList.add('open')}
function buildExport(){var entries=Object.keys(state.logs).map(function(k){return state.logs[k]}).sort(function(a,b){return a.week-b.week||DAYS.indexOf(a.session)-DAYS.indexOf(b.session)});if(!entries.length){state.exportText='No sessions logged yet.';return}var lines=['=== 200KG DEADLIFT PROGRAMME — TRAINING LOG ===','Current Week: '+state.week,''];entries.forEach(function(entry){lines.push('--- Week '+entry.week+' / '+LABELS[entry.session]+' ('+entry.date+') ---');Object.keys(entry.exercises).forEach(function(id){var ex=entry.exercises[id];var sets=ex.sets.filter(function(s){return s.weight||s.reps||s.rpe});if(!sets.length&&!ex.notes)return;var setText=sets.map(function(s,idx){var parts=[];if(s.weight)parts.push(s.weight+(state.maxes.unit||'kg'));if(s.reps)parts.push(s.reps+' reps');if(s.rpe)parts.push('RPE '+s.rpe);return 'Set '+(idx+1)+': '+parts.join(' × ')}).join(' | ');lines.push('  '+ex.name+': '+(setText||'(no data)')+(ex.notes?' — '+ex.notes:''))});lines.push('')});state.exportText=lines.join(String.fromCharCode(10))}
app.addEventListener('click',function(event){var el=event.target.closest('[data-action]');if(!el)return;var a=el.dataset.action;if(a==='tab'){state.tab=el.dataset.tab;render()}if(a==='advance-week'){state.week=Math.min(16,state.week+1);state.logWeek=state.week;persist();render()}if(a==='open-session'){state.day=el.dataset.day;state.logWeek=Number(el.dataset.week);state.tab='log session';persist();render()}if(a==='set-log-week'){state.logWeek=Number(el.dataset.week);render()}if(a==='set-day'){state.day=el.dataset.day;persist();render()}if(a==='add-set'){var d1=currentDraft();d1[el.dataset.ex].sets.push({weight:'',reps:'',rpe:''});saveDraft(d1);render()}if(a==='delete-set'){var d2=currentDraft();var sets=d2[el.dataset.ex].sets;sets.splice(Number(el.dataset.set),1);if(!sets.length)sets.push({weight:'',reps:'',rpe:''});saveDraft(d2);render()}if(a==='save-session'){var k=skey(state.logWeek,state.day);state.logs[k]={date:today(),week:state.logWeek,session:state.day,exercises:currentDraft()};delete state.drafts[k];if(state.logWeek>=state.week)state.week=state.logWeek;persist();render()}if(a==='toggle-history'){var idx=Number(el.dataset.index);state.openHistory=state.openHistory===idx?null:idx;render()}if(a==='make-export'){buildExport();render()}if(a==='copy-export'){if(navigator.clipboard)navigator.clipboard.writeText(state.exportText);state.copied=true;render()}if(a==='show-week'){showWeek(Number(el.dataset.week))}});
modal.addEventListener('click',function(event){if(event.target===modal||(event.target.dataset&&event.target.dataset.action==='close-modal'))modal.classList.remove('open')});
app.addEventListener('input',function(event){var el=event.target.closest('[data-action]');if(!el)return;var a=el.dataset.action;if(a==='edit-set'){var d=currentDraft();d[el.dataset.ex].sets[Number(el.dataset.set)][el.dataset.field]=clean(el.value);el.value=d[el.dataset.ex].sets[Number(el.dataset.set)][el.dataset.field];saveDraft(d)}if(a==='edit-notes'){var n=currentDraft();n[el.dataset.ex].notes=el.value;saveDraft(n)}if(a==='set-max'){state.maxes[el.dataset.max]=clean(el.value);el.value=state.maxes[el.dataset.max];persist()}if(a==='set-unit'){state.maxes.unit=el.value;persist()}});
render();
})();

</script>
</body>
</html>
